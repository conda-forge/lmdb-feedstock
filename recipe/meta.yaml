{% set version = "0.9.35" %}

package:
  name: lmdb
  version: {{ version }}

source:
  url: https://github.com/LMDB/lmdb/archive/refs/tags/LMDB_{{ version }}.tar.gz
  sha256: 18b021fd589d30cc08860a9550a30ae51637117451385e9581616da751326632
  patches:
    - patches/Makefile.patch
    - patches/cve-2019-16224-validate-db-flags.patch
    - patches/cve-2019-16225-reject-dirty-pages.patch
    - patches/cve-2019-16226-validate-node-del-size.patch
    - patches/cve-2019-16227-guard-xcursor-null.patch
    - patches/cve-2019-16228-validate-psize.patch

build:
  number: 1
  run_exports:
    - {{ pin_subpackage("lmdb", max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cmake <4  # [win]
    - ninja     # [win]

test:
  requires:
    - {{ compiler('c') }}    # [unix]
    # CMake needs compiler on Windows to be able to run package detection.
    # See: https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
    - {{ compiler('cxx') }}  # [win]
    - cmake <4               # [win]
  files:
    - cmake_test/
    - patch_tests/           # [unix]

  commands:
    # binaries
    - mdb_copy -V  # [unix]
    - mdb_dump -V  # [unix]
    - mdb_load -V  # [unix]
    - mdb_stat -V  # [unix]

    # presence of shared lib:
    - test -f ${PREFIX}/lib/liblmdb.so               # [unix]
    - if not exist %LIBRARY_BIN%\lmdb.dll exit 1     # [win]
    - if not exist %LIBRARY_LIB%\lmdb.lib exit 1     # [win]

    # absence of static lib:
    - test ! -f ${PREFIX}/lib/liblmdb.a              # [unix]

    # headers:
    - test -f ${PREFIX}/include/lmdb.h               # [unix]
    - if not exist %LIBRARY_INC%\lmdb.h exit 1       # [win]

    # Test CMake installation on Windows
    - cd cmake_test                                  # [win]
    - cmake %CMAKE_ARGS% .                           # [win]

    # CVE-2019-16224..16228 patch regression tests
    - $CC patch_tests/test_cve_patches.c -o test_cve_patches -I${PREFIX}/include -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -llmdb  # [unix]
    - ./test_cve_patches                                                                                                           # [unix]

about:
  home: https://www.openldap.org/software/repo.html
  license: OLDAP-2.8
  license_file: libraries/liblmdb/LICENSE
  summary: A high-performance embedded transactional key-value store database.
  # this is a mirror; the original sources come from gitlab, see
  # https://git.openldap.org/openldap/openldap/-/tree/mdb.master
  dev_url: https://github.com/LMDB/lmdb

extra:
  recipe-maintainers:
    - jakirkham
    - h-vetinari
    - jjerphan
